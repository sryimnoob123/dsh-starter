# electron-builder 配置骨架（架构文档 §7 打包配置切换位，[FR-32.1]）
# 统一开源版：只出安装包、不含任何授权逻辑（[D70]）。

appId: com.dshdesktop.app
productName: deepseekharness
directories:
  output: dist/installer
  buildResources: build
files:
  - dist/main/**/*
  - assets/**/*
  - package.json
win:
  target:
    - nsis
  icon: assets/icon.png
# [D78] 自动更新：GitHub 发布源（生成 latest.yml + 内嵌 app-update.yml；
# 产物仍用 gh CLI 上传到 Release，electron-builder 本身不发布）
publish:
  provider: github
  owner: sryimnoob123
  repo: dsh-starter
  publishAutoUpdate: true
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
