<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>deepseekharness</title>
    <!--
      通知历史页（[D31] 通知历史中心）
      桥契约：dshShell.readNotifications() / dshShell.clearNotifications()
      视觉：方案 A「气泡蓝」+ OpenChamber 深色 token（用户拍板，[D83]/[D76]）
    -->
    <style>
      :root {
        color-scheme: dark;
        --brand: oklch(77% .17 85);
        --brand-hover: oklch(70.5% .213 47.604);
        --brand-active: oklch(65% .2 55);
        --bg: #151313;
        --card: oklch(19% .01 40);
        --text: oklch(85% .02 90);
        --text-2: oklch(75% .02 80);
        --error: oklch(65% .15 30);
        --line: oklch(31% .01 35);
        --input-bg: oklch(16% .01 30);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font: 400 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif;
        padding: 28px 20px 40px;
        display: flex; justify-content: center;
      }
      .card {
        width: min(640px, 100%);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 30px 30px 24px;
        box-shadow: 0 10px 32px rgba(0, 0, 0, 0.4);
        display: flex; flex-direction: column;
        min-height: 300px;
      }
      .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
      h1 { margin: 0; font-size: 22px; font-weight: 600; }
      .hint { margin: 0; color: var(--text-2); font-size: 13px; }
      .list { list-style: none; margin: 0; padding: 0; flex: 1; overflow: auto; }
      .item {
        border-top: 1px solid var(--line);
        padding: 10px 2px;
      }
      .item:first-child { border-top: 0; }
      .item .meta { display: flex; justify-content: space-between; gap: 10px; color: var(--text-2); font-size: 12px; }
      .item .body { margin-top: 2px; overflow-wrap: anywhere; }
      .empty { color: var(--text-2); text-align: center; padding: 40px 0; }
      .row { display: flex; gap: 10px; margin-top: 16px; }
      .btn {
        min-height: 38px; padding: 8px 18px;
        border: 0; border-radius: 10px; cursor: pointer;
        font: 600 14px/1.2 "Segoe UI", "Microsoft YaHei", sans-serif;
        background: var(--brand); color: oklch(16% .01 30);
        transition: background 120ms ease;
      }
      .btn:hover { background: var(--brand-hover); }
      .btn:active { background: var(--brand-active); }
      .btn[disabled] { opacity: 0.55; cursor: default; }
      .status { min-height: 1.4em; margin: 12px 0 0; color: var(--text-2); font-size: 13px; }
      .status.err { color: var(--error); }
      :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
      @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="head">
        <h1 id="title"></h1>
        <p class="hint" id="hint"></p>
      </div>
      <ul class="list" id="list"></ul>
      <p class="empty" id="empty" hidden></p>
      <div class="row">
        <button class="btn" id="clearBtn" type="button"></button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>

    <script>
      'use strict';
      const params = new URLSearchParams(location.search);
      const lang = (params.get('lang') || 'zh').toLowerCase().startsWith('en') ? 'en' : 'zh';
      document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';

      const STR = {
        zh: {
          docTitle: '通知',
          title: '通知',
          hint: '错过弹窗也能回看（最多 500 条）',
          empty: '还没有通知记录。任务完成/失败、卡住提醒等都会记在这里。',
          clear: '清空全部',
          cleared: '已清空。',
          failed: '操作失败：',
          preview: '预览模式：未连接壳。',
        },
        en: {
          docTitle: 'Notifications',
          title: 'Notifications',
          hint: 'Missed a toast? Find it here (last 500)',
          empty: 'No notifications yet. Job results, stall alerts and similar will be recorded here.',
          clear: 'Clear all',
          cleared: 'Cleared.',
          failed: 'Failed: ',
          preview: 'Preview mode: no shell connected.',
        },
      };
      const t = STR[lang];
      document.title = 'deepseekharness — ' + t.docTitle;

      const $ = (id) => document.getElementById(id);
      const list = $('list');
      const empty = $('empty');
      const status = $('status');
      const clearBtn = $('clearBtn');

      $('title').textContent = t.title;
      $('hint').textContent = t.hint;
      $('empty').textContent = t.empty;
      clearBtn.textContent = t.clear;

      function setStatus(text, isErr) {
        status.textContent = text;
        status.className = 'status' + (isErr ? ' err' : '');
      }

      function fmtTime(ms) {
        const d = new Date(ms);
        const pad = (n) => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }

      function render(entries) {
        list.innerHTML = '';
        empty.hidden = entries.length > 0;
        for (const entry of entries) {
          const li = document.createElement('li');
          li.className = 'item';
          const meta = document.createElement('div');
          meta.className = 'meta';
          const time = document.createElement('span');
          time.textContent = fmtTime(entry.time);
          const kind = document.createElement('span');
          kind.textContent = entry.title;
          meta.append(time, kind);
          const body = document.createElement('div');
          body.className = 'body';
          body.textContent = entry.body;
          li.append(meta, body);
          list.appendChild(li);
        }
      }

      async function reload() {
        try {
          render(await window.dshShell.readNotifications());
        } catch (error) {
          setStatus(t.failed + String(error), true);
        }
      }

      clearBtn.addEventListener('click', async () => {
        try {
          await window.dshShell.clearNotifications();
          render([]);
          setStatus(t.cleared, false);
        } catch (error) {
          setStatus(t.failed + String(error), true);
        }
      });

      if (!window.dshShell || typeof window.dshShell.readNotifications !== 'function') {
        setStatus(t.preview, true);
        clearBtn.disabled = true;
      } else {
        void reload();
      }
    </script>
  </body>
</html>
