<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>deepseekharness</title>
    <!--
      设置页 — 提示词管理（FR-16 V1）
      视觉 = OpenChamber/Codex 设计系统原样（vendor 自 openchamber/openchamber 源码
      packages/ui/src/styles/design-system.css：token 值、9px 圆角、设置页布局
      max-width 840px / py-8 / border-t 分隔 section / 复选框行 / 单选组逐项照抄，[FR-35] 用户拍板）。
      桥契约：dshShell.getPromptSettings / savePromptSettings / listProjectInstructions /
      saveProjectInstruction / openMain
    -->
    <style>
      /* ===== OpenChamber 设计 token（design-system.css 原值） ===== */
      html[data-dsh-theme="dark"] {
        --background: oklch(0.16 0.01 30);
        --foreground: oklch(0.85 0.02 90);
        --card: oklch(0.19 0.01 40);
        --popover: oklch(0.24 0.01 40);
        --primary: oklch(0.77 0.17 85);
        --primary-foreground: oklch(0.16 0.01 30);
        --secondary: oklch(0.29 0.01 40);
        --muted: oklch(0.33 0.01 40);
        --muted-foreground: oklch(0.75 0.02 80);
        --accent: oklch(0.29 0.01 40);
        --destructive: oklch(0.65 0.15 30);
        --border: oklch(0.31 0.01 35);
        --input: oklch(0.33 0.01 40);
        --ring: oklch(0.77 0.17 85);
        --status-error: oklch(0.65 0.15 30);
        --status-success: oklch(0.68 0.12 145);
      }
      html[data-dsh-theme="light"] {
        --background: oklch(0.97 0.02 85);
        --foreground: oklch(0.25 0.02 40);
        --card: oklch(0.99 0.01 90);
        --popover: oklch(0.99 0.01 90);
        --primary: oklch(0.65 0.2 55);
        --primary-foreground: oklch(0.99 0.01 90);
        --secondary: oklch(0.92 0.02 80);
        --muted: oklch(0.9 0.015 75);
        --muted-foreground: oklch(0.45 0.02 50);
        --accent: oklch(0.92 0.02 80);
        --destructive: oklch(0.55 0.25 25);
        --border: oklch(0.85 0.02 70);
        --input: oklch(0.88 0.02 75);
        --ring: oklch(0.65 0.2 55);
        --status-error: oklch(0.55 0.25 25);
        --status-success: oklch(0.55 0.14 150);
      }
      :root {
        --radius: 0.5625rem; /* OC 9px */
        --background: oklch(0.16 0.01 30);
        --foreground: oklch(0.85 0.02 90);
        --primary: oklch(0.77 0.17 85);
        --primary-foreground: oklch(0.16 0.01 30);
        --secondary: oklch(0.29 0.01 40);
        --muted: oklch(0.33 0.01 40);
        --muted-foreground: oklch(0.75 0.02 80);
        --border: oklch(0.31 0.01 35);
        --input: oklch(0.33 0.01 40);
        --ring: oklch(0.77 0.17 85);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        background: var(--background);
        color: var(--foreground);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        font-size: 14px;
        line-height: 1.5;
      }

      /* ===== 设置页布局（OC SettingsPageLayout：max-width 840px / px-6 py-6 → @3xl px-12 py-8） ===== */
      .oc-page { max-width: 840px; margin: 0 auto; padding: 24px; }
      @media (min-width: 1024px) { .oc-page { padding: 32px 48px; } }

      .oc-head {
        display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between;
        gap: 12px 16px; padding-bottom: 24px; margin-bottom: 8px;
      }
      .oc-head-main { min-width: 0; flex: 1 1 256px; }
      h1.oc-page-title {
        font-size: 18px; font-weight: 600; line-height: 1.25; letter-spacing: -0.01em;
        margin: 0; color: var(--muted-foreground); /* OC L1：比 section 标题更安静 */
      }
      .oc-desc { font-size: 14px; color: var(--muted-foreground); margin: 4px 0 0; max-width: 62ch; }

      /* section：border-t 分隔、py-8，首个无顶线（OC SettingsSection） */
      .oc-section { border-top: 1px solid color-mix(in oklch, var(--border) 60%, transparent); padding: 32px 0; }
      .oc-section:first-of-type { border-top: 0; padding-top: 0; }
      .oc-section h2 { font-size: 15px; font-weight: 600; line-height: 1.2; margin: 0 0 4px; }
      .oc-section > .oc-desc { margin: 0 0 16px; }

      /* 字段行：窄屏纵向、宽屏 label 列 224px + 右侧控件（OC SettingsFieldRow） */
      .oc-field-row { display: flex; flex-direction: column; gap: 8px; padding: 2px 0; }
      .oc-label-col { min-width: 0; }
      .oc-control { display: flex; min-width: 0; flex: 1; align-items: center; gap: 8px; }
      @media (min-width: 720px) {
        .oc-field-row { flex-direction: row; align-items: center; gap: 32px; }
        .oc-label-col { width: 224px; flex: none; }
        .oc-control { justify-content: flex-end; }
        .oc-control--start { justify-content: flex-start; }
      }
      .oc-field-label { font-size: 14px; line-height: 1.2; }
      .oc-helper { font-size: 14px; line-height: 1.5; color: var(--muted-foreground); }

      /* 复选框行 / 单选组（OC SettingsCheckboxRow / SettingsRadioOption 的视觉） */
      .oc-opt-stack { display: flex; flex-direction: column; gap: 6px; }
      .oc-check-row, .oc-radio-row {
        display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 2px 0; user-select: none;
      }
      .oc-check-row.has-desc, .oc-radio-row.has-desc { align-items: flex-start; }
      .oc-check-row.has-desc .oc-checkbox, .oc-radio-row.has-desc .oc-radio-dot { margin-top: 2px; }
      .oc-check-input, .oc-radio-input { position: absolute; opacity: 0; pointer-events: none; }
      .oc-checkbox {
        width: 16px; height: 16px; flex: none; border: 1px solid var(--border); border-radius: 6px;
        display: grid; place-items: center;
      }
      .oc-check-input:checked + .oc-checkbox { background: var(--primary); border-color: var(--primary); }
      .oc-check-input:checked + .oc-checkbox::after {
        content: ""; width: 9px; height: 5px;
        border-left: 2px solid var(--primary-foreground); border-bottom: 2px solid var(--primary-foreground);
        transform: rotate(-45deg) translate(0, -1px);
      }
      .oc-check-input:focus-visible + .oc-checkbox, .oc-radio-input:focus-visible + .oc-radio-dot {
        outline: 2px solid var(--ring); outline-offset: 2px;
      }
      .oc-radio-dot { width: 16px; height: 16px; flex: none; border: 1px solid var(--border); border-radius: 50%; display: grid; place-items: center; }
      .oc-radio-input:checked + .oc-radio-dot { border-color: var(--primary); }
      .oc-radio-input:checked + .oc-radio-dot::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
      .oc-check-text, .oc-radio-text { display: flex; flex-direction: column; min-width: 0; }
      .oc-radio-row .oc-field-label { color: color-mix(in oklch, var(--foreground) 55%, transparent); }
      .oc-radio-input:checked ~ .oc-radio-text .oc-field-label { color: var(--foreground); }

      /* 输入 / 文本域 / 下拉（OC 输入语言） */
      .oc-input, .oc-textarea, .oc-select {
        width: 100%; background: var(--input); color: var(--foreground);
        border: 1px solid var(--border); border-radius: var(--radius);
        font: 400 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        padding: 8px 12px;
      }
      .oc-textarea { resize: vertical; min-height: 96px; font-family: ui-monospace, 'SF Mono', Consolas, 'JetBrains Mono', Menlo, monospace; font-size: 13px; }
      .oc-select { padding-right: 8px; }
      .oc-input:focus, .oc-textarea:focus, .oc-select:focus { outline: 2px solid var(--ring); outline-offset: 1px; }
      .oc-input[disabled], .oc-textarea[disabled] { opacity: 0.55; }
      .oc-path {
        font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 12px;
        color: var(--muted-foreground); background: var(--input);
        border: 1px solid var(--border); border-radius: var(--radius);
        padding: 6px 10px; margin: 0 0 10px; overflow-wrap: anywhere;
      }
      .oc-note {
        background: var(--secondary); border: 1px dashed var(--border);
        border-radius: var(--radius); padding: 10px 14px;
        color: var(--muted-foreground); font-size: 14px;
      }

      /* 按钮（OC Button：36px 主按钮琥珀底、ghost 描边、chip 小号） */
      .oc-btn {
        height: 36px; padding: 0 16px; border-radius: var(--radius); border: 1px solid transparent;
        font: 500 14px/36px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        cursor: pointer;
      }
      .oc-btn--primary { background: var(--primary); color: var(--primary-foreground); }
      .oc-btn--primary:hover { background: color-mix(in oklch, var(--primary) 88%, var(--foreground)); }
      .oc-btn--ghost { background: transparent; color: var(--foreground); border-color: var(--border); }
      .oc-btn--ghost:hover { background: var(--muted); }
      .oc-btn--chip {
        height: 28px; padding: 0 12px; font-size: 13px; font-weight: 400; line-height: 28px;
        background: transparent; color: var(--muted-foreground); border-color: var(--border);
      }
      .oc-btn--chip:hover { color: var(--foreground); }
      .oc-btn[disabled] { opacity: 0.55; cursor: default; }
      .oc-actions { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 8px; }
      .oc-status { min-height: 20px; margin-top: 12px; font-size: 14px; color: var(--muted-foreground); }
      .oc-status.err { color: var(--status-error); }
      .oc-status.ok { color: var(--status-success); }

      .oc-banner {
        border: 1px solid var(--border); background: var(--secondary);
        border-radius: var(--radius); padding: 10px 14px; margin: 0 0 8px; font-size: 14px;
      }
      .oc-banner[hidden] { display: none; }
    </style>
  </head>
  <body>
    <main class="oc-page">
      <div class="oc-head">
        <div class="oc-head-main">
          <h1 class="oc-page-title" id="title"></h1>
          <p class="oc-desc" id="lede"></p>
        </div>
        <button class="oc-btn oc-btn--ghost" id="backBtn" type="button"></button>
      </div>

      <section class="oc-section">
        <h2 id="gGlobalTitle"></h2>
        <p class="oc-desc" id="gGlobalHint"></p>
        <p class="oc-path" id="globalPath"></p>
        <textarea class="oc-textarea" id="globalPrompt" rows="10" spellcheck="false" placeholder=""></textarea>
      </section>

      <section class="oc-section">
        <h2 id="gInjectTitle"></h2>
        <p class="oc-desc" id="gInjectHint"></p>
        <div class="oc-opt-stack">
          <label class="oc-check-row">
            <input type="checkbox" class="oc-check-input" id="identityToggle" />
            <span class="oc-checkbox" aria-hidden="true"></span>
            <span class="oc-check-text">
              <span class="oc-field-label" id="gIdentityLabel"></span>
              <span class="oc-helper" id="gIdentityHint"></span>
            </span>
          </label>
          <label class="oc-check-row has-desc">
            <input type="checkbox" class="oc-check-input" id="personaToggle" />
            <span class="oc-checkbox" aria-hidden="true"></span>
            <span class="oc-check-text">
              <span class="oc-field-label" id="gPersonaTitle"></span>
              <span class="oc-helper" id="gPersonaHint"></span>
            </span>
          </label>
        </div>
        <div class="oc-field-row" style="margin-top: 8px">
          <div class="oc-label-col">
            <span class="oc-field-label" id="gPersonaTemplate"></span>
            <p class="oc-helper" id="gPersonaTemplateHint"></p>
          </div>
          <div class="oc-control oc-control--start">
            <textarea class="oc-textarea" id="persona" rows="4" spellcheck="false"></textarea>
          </div>
        </div>
        <div class="oc-actions">
          <button class="oc-btn oc-btn--chip" id="injectDefaultsBtn" type="button"></button>
        </div>
      </section>

      <section class="oc-section">
        <h2 id="gProjectTitle"></h2>
        <p class="oc-desc" id="gProjectHint"></p>
        <select class="oc-select" id="workspaceSelect" aria-label="workspace"></select>
        <p class="oc-path" id="projectPath" style="margin-top: 10px"></p>
        <textarea class="oc-textarea" id="projectPrompt" rows="8" spellcheck="false"></textarea>
        <div class="oc-actions">
          <button class="oc-btn oc-btn--primary" id="projectSaveBtn" type="button"></button>
        </div>
        <p class="oc-status" id="projectStatus" role="status" aria-live="polite"></p>
      </section>

      <section class="oc-section">
        <h2 id="gNotifyTitle"></h2>
        <p class="oc-desc" id="gNotifyHint"></p>
        <label class="oc-check-row">
          <input type="checkbox" class="oc-check-input" id="notifyToggle" />
          <span class="oc-checkbox" aria-hidden="true"></span>
          <span class="oc-check-text">
            <span class="oc-field-label" id="gNotifyLabel"></span>
          </span>
        </label>
      </section>

      <section class="oc-section">
        <h2 id="gAppearanceTitle"></h2>
        <p class="oc-desc" id="gAppearanceHint"></p>
        <div class="oc-opt-stack" role="radiogroup" aria-label="theme">
          <label class="oc-radio-row has-desc">
            <input type="radio" class="oc-radio-input" name="uiTheme" value="system" id="themeSystemRadio" checked />
            <span class="oc-radio-dot" aria-hidden="true"></span>
            <span class="oc-radio-text">
              <span class="oc-field-label" id="themeSystem"></span>
              <span class="oc-helper" id="themeSystemHint"></span>
            </span>
          </label>
          <label class="oc-radio-row has-desc">
            <input type="radio" class="oc-radio-input" name="uiTheme" value="dark" id="themeDarkRadio" />
            <span class="oc-radio-dot" aria-hidden="true"></span>
            <span class="oc-radio-text">
              <span class="oc-field-label" id="themeDark"></span>
              <span class="oc-helper" id="themeDarkHint"></span>
            </span>
          </label>
          <label class="oc-radio-row has-desc">
            <input type="radio" class="oc-radio-input" name="uiTheme" value="light" id="themeLightRadio" />
            <span class="oc-radio-dot" aria-hidden="true"></span>
            <span class="oc-radio-text">
              <span class="oc-field-label" id="themeLight"></span>
              <span class="oc-helper" id="themeLightHint"></span>
            </span>
          </label>
        </div>
        <p class="oc-status" id="themeStatus" role="status" aria-live="polite"></p>
      </section>

      <section class="oc-section">
        <h2 id="gTemplatesTitle"></h2>
        <div class="oc-note" id="gTemplatesNote"></div>
      </section>

      <div class="oc-actions">
        <button class="oc-btn oc-btn--primary" id="saveBtn" type="button"></button>
        <button class="oc-btn oc-btn--ghost" id="saveRestartBtn" type="button"></button>
      </div>
      <p class="oc-status" id="status" role="status" aria-live="polite"></p>
    </main>

    <script>
      'use strict';
      const params = new URLSearchParams(location.search);
      const lang = (params.get('lang') || 'zh').toLowerCase().startsWith('en') ? 'en' : 'zh';
      document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';

      const WEB_BASE_PERSONA =
        'You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.';

      const STR = {
        zh: {
          docTitle: '设置',
          title: '设置',
          lede: '管理提示词注入、项目级指令、通知与外观。改完点保存，马上生效。',
          preview: '预览模式：未连接壳，编辑不会保存。',
          gGlobalTitle: '全局系统提示词',
          gGlobalHint: '写在这里的内容，每次对话都会自动带上。改完点保存，马上生效。',
          gGlobalPlaceholder: '在这里写全局规则，例如：\n\n- 用中文回答\n- 先想清楚再动手',
          gInjectTitle: '系统提示词注入',
          gInjectHint: '下面两个开关，决定每次对话要不要额外带上「身份」和「人设」这两段文字。',
          gIdentityLabel: '身份注入',
          gIdentityHint: '勾上后，每次对话开头会加一句「我是 DeepSeek Harness」。默认不勾。',
          gPersonaTitle: '人设注入',
          gPersonaHint: '勾上后，你写的人设会一直拼在对话里。支持 {{model}} 和 {{cwd}} 两个占位符。不勾 = 不注入。',
          gPersonaTemplate: '人设模板',
          gPersonaTemplateHint: '打开开关即注入；修改模板后保存生效。',
          injectDefaults: '一键填入默认提示词',
          gProjectTitle: '项目级指令',
          gProjectHint: '只对某个工作区生效的规则，存在那个工作区的 AGENTS.md 里。',
          projectSave: '保存到该工作区',
          projectLoading: '正在读取工作区…',
          projectNone: '没有工作区，或服务没在运行。',
          projectSaved: '已保存。',
          projectFailed: '保存失败：',
          gNotifyTitle: '通知',
          gNotifyHint: '任务做完或失败时，弹个桌面通知提醒你，点它能回到对应会话。',
          gNotifyLabel: '任务结果通知',
          gAppearanceTitle: '外观',
          gAppearanceHint: '整窗配色（Codex 风）。切换即时生效，下次启动保持。',
          themeSystem: '跟随系统',
          themeSystemHint: '随操作系统的深浅色自动切换（默认）。',
          themeDark: '深色',
          themeDarkHint: '始终使用深色主题。',
          themeLight: '浅色',
          themeLightHint: '始终使用浅色主题。',
          themeSaved: '已保存。',
          themeFailed: '保存失败：',
          gTemplatesTitle: '内置流程模板',
          gTemplatesNote:
            '子 agent 派发/汇总模板、计划模式提示词目前写死在 DSH 内置预设里，DSH 还没有开放终端用户编辑这些模板的接口。想定制流程，可以把规范写进上面的全局指令文件，效果等同。',
          save: '保存',
          saveRestart: '重启并加载',
          saved: '已保存，马上生效。',
          savedRestart: '已保存，正在重启服务…',
          failed: '保存失败：',
          back: '返回对话',
        },
        en: {
          docTitle: 'Settings',
          title: 'Settings',
          lede: 'Manage prompt injection, project instructions, notifications and appearance. Save applies changes right away.',
          preview: 'Preview mode: no shell connected, edits are not saved.',
          gGlobalTitle: 'Global system prompt',
          gGlobalHint: 'Whatever you write here is added to every conversation. Save applies it right away.',
          gGlobalPlaceholder: 'Write global rules here, e.g.:\n\n- Answer in Chinese\n- Think before acting',
          gInjectTitle: 'System prompt injection',
          gInjectHint: 'Two switches that decide whether to add the identity and persona texts to every conversation.',
          gIdentityLabel: 'Identity injection',
          gIdentityHint: 'When on, each conversation starts with a line saying "I am DeepSeek Harness". Off by default.',
          gPersonaTitle: 'Persona injection',
          gPersonaHint: 'When on, the persona you write is always included in conversations. Supports {{model}} and {{cwd}}. Off = not injected.',
          gPersonaTemplate: 'Persona template',
          gPersonaTemplateHint: 'Injected when the switch is on; edits apply on save.',
          injectDefaults: 'Fill default prompt with one click',
          gProjectTitle: 'Project instructions',
          gProjectHint: 'Rules for one workspace only, stored in that workspace AGENTS.md.',
          projectSave: 'Save to workspace',
          projectLoading: 'Loading workspaces…',
          projectNone: 'No workspaces, or the service is not running.',
          projectSaved: 'Saved.',
          projectFailed: 'Save failed: ',
          gNotifyTitle: 'Notifications',
          gNotifyHint: 'A desktop notification when a job finishes or fails; clicking it jumps to the session.',
          gNotifyLabel: 'Job result notifications',
          gAppearanceTitle: 'Appearance',
          gAppearanceHint: 'Window-wide color scheme (Codex style). Switching applies immediately and persists across restarts.',
          themeSystem: 'Follow system',
          themeSystemHint: 'Switch automatically with the operating system (default).',
          themeDark: 'Dark',
          themeDarkHint: 'Always use the dark theme.',
          themeLight: 'Light',
          themeLightHint: 'Always use the light theme.',
          themeSaved: 'Saved.',
          themeFailed: 'Save failed: ',
          gTemplatesTitle: 'Built-in flow templates',
          gTemplatesNote:
            'Sub-agent dispatch/summary templates and plan-mode prompts currently live inside DSH’s shipped presets, and DSH has no end-user API for editing them yet. To customize flows, write your conventions into the global prompt file above — equivalent effect.',
          save: 'Save',
          saveRestart: 'Restart & reload',
          saved: 'Saved — applied right away.',
          savedRestart: 'Saved — restarting the service…',
          failed: 'Save failed: ',
          back: 'Back to chat',
        },
      };
      const t = STR[lang];
      document.title = 'deepseekharness — ' + t.docTitle;

      const $ = (id) => document.getElementById(id);
      const el = {
        title: $('title'), lede: $('lede'), backBtn: $('backBtn'),
        gGlobalTitle: $('gGlobalTitle'), gGlobalHint: $('gGlobalHint'),
        globalPath: $('globalPath'), globalPrompt: $('globalPrompt'),
        gInjectTitle: $('gInjectTitle'), gInjectHint: $('gInjectHint'),
        gIdentityLabel: $('gIdentityLabel'), gIdentityHint: $('gIdentityHint'), identityToggle: $('identityToggle'),
        gPersonaTitle: $('gPersonaTitle'), gPersonaHint: $('gPersonaHint'),
        gPersonaTemplate: $('gPersonaTemplate'), gPersonaTemplateHint: $('gPersonaTemplateHint'),
        personaToggle: $('personaToggle'), persona: $('persona'), injectDefaultsBtn: $('injectDefaultsBtn'),
        gProjectTitle: $('gProjectTitle'), gProjectHint: $('gProjectHint'),
        workspaceSelect: $('workspaceSelect'), projectPath: $('projectPath'), projectPrompt: $('projectPrompt'),
        projectSaveBtn: $('projectSaveBtn'), projectStatus: $('projectStatus'),
        gNotifyTitle: $('gNotifyTitle'), gNotifyHint: $('gNotifyHint'),
        gNotifyLabel: $('gNotifyLabel'), notifyToggle: $('notifyToggle'),
        gAppearanceTitle: $('gAppearanceTitle'), gAppearanceHint: $('gAppearanceHint'),
        themeSystemRadio: $('themeSystemRadio'), themeDarkRadio: $('themeDarkRadio'), themeLightRadio: $('themeLightRadio'),
        themeSystem: $('themeSystem'), themeSystemHint: $('themeSystemHint'),
        themeDark: $('themeDark'), themeDarkHint: $('themeDarkHint'),
        themeLight: $('themeLight'), themeLightHint: $('themeLightHint'), themeStatus: $('themeStatus'),
        gTemplatesTitle: $('gTemplatesTitle'), gTemplatesNote: $('gTemplatesNote'),
        saveBtn: $('saveBtn'), saveRestartBtn: $('saveRestartBtn'), status: $('status'),
      };

      function applyText() {
        el.title.textContent = t.title;
        el.lede.textContent = t.lede;
        el.backBtn.textContent = t.back;
        el.gGlobalTitle.textContent = t.gGlobalTitle;
        el.gGlobalHint.textContent = t.gGlobalHint;
        el.globalPrompt.placeholder = t.gGlobalPlaceholder;
        el.gInjectTitle.textContent = t.gInjectTitle;
        el.gInjectHint.textContent = t.gInjectHint;
        el.gIdentityLabel.textContent = t.gIdentityLabel;
        el.gIdentityHint.textContent = t.gIdentityHint;
        el.gPersonaTitle.textContent = t.gPersonaTitle;
        el.gPersonaHint.textContent = t.gPersonaHint;
        el.gPersonaTemplate.textContent = t.gPersonaTemplate;
        el.gPersonaTemplateHint.textContent = t.gPersonaTemplateHint;
        el.injectDefaultsBtn.textContent = t.injectDefaults;
        el.gProjectTitle.textContent = t.gProjectTitle;
        el.gProjectHint.textContent = t.gProjectHint;
        el.projectSaveBtn.textContent = t.projectSave;
        el.gNotifyTitle.textContent = t.gNotifyTitle;
        el.gNotifyHint.textContent = t.gNotifyHint;
        el.gNotifyLabel.textContent = t.gNotifyLabel;
        el.gAppearanceTitle.textContent = t.gAppearanceTitle;
        el.gAppearanceHint.textContent = t.gAppearanceHint;
        el.themeSystem.textContent = t.themeSystem;
        el.themeSystemHint.textContent = t.themeSystemHint;
        el.themeDark.textContent = t.themeDark;
        el.themeDarkHint.textContent = t.themeDarkHint;
        el.themeLight.textContent = t.themeLight;
        el.themeLightHint.textContent = t.themeLightHint;
        el.gTemplatesTitle.textContent = t.gTemplatesTitle;
        el.gTemplatesNote.textContent = t.gTemplatesNote;
        el.saveBtn.textContent = t.save;
        el.saveRestartBtn.textContent = t.saveRestart;
      }
      applyText();

      function setStatus(text, isErr) {
        el.status.textContent = text;
        el.status.className = 'oc-status' + (isErr ? ' err' : '');
      }

      function buildPayload(restart) {
        return {
          includeHarnessIdentity: el.identityToggle.checked,
          // Persona 注入开关：关 = 不注入（存空）
          persona: el.personaToggle.checked ? el.persona.value : '',
          globalPrompt: el.globalPrompt.value,
          notifyResult: el.notifyToggle.checked,
          restart,
        };
      }

      async function save(restart) {
        const shell = window.dshShell;
        if (!shell) { setStatus(t.preview, true); return; }
        setStatus('…');
        try {
          const result = await shell.savePromptSettings(buildPayload(restart));
          if (result && result.ok) {
            setStatus(result.restarting ? t.savedRestart : (result.message || t.saved), false);
            if (result.restarting) {
              el.saveBtn.disabled = true;
              el.saveRestartBtn.disabled = true;
            }
          } else {
            setStatus(t.failed + (result && result.message ? result.message : ''), true);
          }
        } catch (error) {
          setStatus(t.failed + String(error), true);
        }
      }

      el.saveBtn.addEventListener('click', () => save(false));
      el.saveRestartBtn.addEventListener('click', () => save(true));
      el.backBtn.addEventListener('click', () => {
        const shell = window.dshShell;
        if (shell && typeof shell.openMain === 'function') shell.openMain();
      });
      // 一键注入默认提示词：两个开关全开 + 默认模板
      el.injectDefaultsBtn.addEventListener('click', () => {
        el.identityToggle.checked = true;
        el.personaToggle.checked = true;
        el.persona.value = WEB_BASE_PERSONA;
        setStatus(t.injectDefaults + ' ✓', false);
      });

      // ---- 项目级指令（[FR-16.7] P1） ----
      let projectRows = [];
      function renderWorkspace(row) {
        el.workspaceSelect.value = row.workspaceId;
        el.projectPath.textContent = row.path ? row.path + '/AGENTS.md' : '';
        el.projectPrompt.value = row.content || '';
      }
      function setProjectStatus(text, isErr) {
        el.projectStatus.textContent = text;
        el.projectStatus.className = 'oc-status' + (isErr ? ' err' : '');
      }
      async function loadProjectInstructions() {
        const shell = window.dshShell;
        if (!shell || typeof shell.listProjectInstructions !== 'function') return;
        setProjectStatus(t.projectLoading, false);
        try {
          const result = await shell.listProjectInstructions();
          if (!result || !result.ok) {
            setProjectStatus(result && result.message ? result.message : t.projectNone, true);
            return;
          }
          projectRows = result.items || [];
          el.workspaceSelect.innerHTML = '';
          for (const row of projectRows) {
            const opt = document.createElement('option');
            opt.value = row.workspaceId;
            opt.textContent = row.title || row.path;
            el.workspaceSelect.appendChild(opt);
          }
          if (projectRows.length > 0) {
            renderWorkspace(projectRows[0]);
            setProjectStatus('', false);
          } else {
            setProjectStatus(t.projectNone, true);
          }
        } catch (error) {
          setProjectStatus(t.projectFailed + String(error), true);
        }
      }
      el.workspaceSelect.addEventListener('change', () => {
        const row = projectRows.find((r) => r.workspaceId === el.workspaceSelect.value);
        if (row) renderWorkspace(row);
      });
      el.projectSaveBtn.addEventListener('click', async () => {
        const shell = window.dshShell;
        if (!shell) return;
        const result = await shell.saveProjectInstruction({
          workspaceId: el.workspaceSelect.value,
          content: el.projectPrompt.value,
        });
        setProjectStatus(result.ok ? t.projectSaved : t.projectFailed + (result.message || ''), !result.ok);
      });

      // ---- 外观（跟随系统/深色/浅色三态） ----
      let themeChoice = 'system';
      function systemDark() {
        return typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches;
      }
      function resolvedTheme(choice) {
        return choice === 'system' ? (systemDark() ? 'dark' : 'light') : choice;
      }
      function setThemeRadio(choice) {
        el.themeSystemRadio.checked = choice === 'system';
        el.themeDarkRadio.checked = choice === 'dark';
        el.themeLightRadio.checked = choice === 'light';
      }
      function setPageTheme(resolved) {
        document.documentElement.setAttribute('data-dsh-theme', resolved);
      }
      async function applyTheme(choice) {
        const prev = themeChoice;
        themeChoice = choice;
        setThemeRadio(choice);
        setPageTheme(resolvedTheme(choice));
        const shell = window.dshShell;
        if (!shell || typeof shell.savePromptSettings !== 'function') return;
        try {
          const result = await shell.savePromptSettings({ ...buildPayload(false), uiTheme: choice });
          if (result && result.ok) {
            el.themeStatus.textContent = t.themeSaved;
            el.themeStatus.className = 'oc-status ok';
          } else {
            themeChoice = prev;
            setThemeRadio(prev);
            setPageTheme(resolvedTheme(prev));
            el.themeStatus.textContent = t.themeFailed + (result && result.message ? result.message : '');
            el.themeStatus.className = 'oc-status err';
          }
        } catch (error) {
          themeChoice = prev;
          setThemeRadio(prev);
          setPageTheme(resolvedTheme(prev));
          el.themeStatus.textContent = t.themeFailed + String(error);
          el.themeStatus.className = 'oc-status err';
        }
      }
      el.themeSystemRadio.addEventListener('change', () => { if (el.themeSystemRadio.checked) void applyTheme('system'); });
      el.themeDarkRadio.addEventListener('change', () => { if (el.themeDarkRadio.checked) void applyTheme('dark'); });
      el.themeLightRadio.addEventListener('change', () => { if (el.themeLightRadio.checked) void applyTheme('light'); });
      if (typeof matchMedia === 'function') {
        matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
          if (themeChoice === 'system') setPageTheme(systemDark() ? 'dark' : 'light');
        });
      }

      async function init() {
        const shell = window.dshShell;
        if (!shell || typeof shell.getPromptSettings !== 'function') {
          setStatus(t.preview, true);
          el.saveBtn.disabled = true;
          el.saveRestartBtn.disabled = true;
          return;
        }
        try {
          const state = await shell.getPromptSettings();
          if (!state) throw new Error('empty state');
          el.identityToggle.checked = Boolean(state.includeHarnessIdentity);
          const personaText = typeof state.persona === 'string' ? state.persona : '';
          el.personaToggle.checked = personaText.trim() !== '';
          el.persona.value = personaText || WEB_BASE_PERSONA;
          el.notifyToggle.checked = state.notifyResult !== false;
          const theme = state.uiTheme === 'dark' || state.uiTheme === 'light' ? state.uiTheme : 'system';
          const themeResolved = state.uiThemeResolved === 'light' ? 'light' : 'dark';
          themeChoice = theme;
          setThemeRadio(theme);
          setPageTheme(themeResolved);
          el.globalPrompt.value = typeof state.globalPrompt === 'string' ? state.globalPrompt : '';
          el.globalPath.textContent = state.globalPromptPath || '';
        } catch (error) {
          setStatus(t.failed + String(error), true);
        }
      }
      init();
      loadProjectInstructions();
    </script>
  </body>
</html>
